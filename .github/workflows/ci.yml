name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: self-hosted-compiler
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Generate embedded compiler artifact
        run: cargo run --quiet -- compile compiler/main.vel compiler/bootstrap.velc
      - name: Verify bootstrap and Rust gates
        run: |
          cargo fmt --all -- --check
          cargo check --all-targets
          cargo clippy --all-targets -- -D warnings
          cargo test --all-targets
      - name: Commit verified compiler artifact and restore CI
        shell: bash
        run: |
          cat > .github/workflows/ci.yml <<'EOF'
          name: CI

          on:
            push:
              branches: [main, rust-self-hosted-bootstrap]
            pull_request:

          permissions:
            contents: read

          jobs:
            rust:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: dtolnay/rust-toolchain@stable
                  with:
                    components: rustfmt, clippy
                - name: Format
                  run: cargo fmt --all -- --check
                - name: Check
                  run: cargo check --all-targets
                - name: Clippy
                  run: cargo clippy --all-targets -- -D warnings
                - name: Test
                  run: cargo test --all-targets
          EOF
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/ci.yml
          git add -f compiler/bootstrap.velc
          git commit -m "build: embed verified self-host compiler artifact"
          git push origin HEAD:self-hosted-compiler
