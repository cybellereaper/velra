name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: self-hosted-compiler
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Optimize self-host lexer scans
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('compiler/main.vel')
          text = path.read_text()
          pattern = r'\nlex\(source\) \{.*?\n\}\n\nquote\(value\) \{'
          replacement = r'''
scan_comment_end(source, index) {
    if index >= len(source) { return index }
    if source[index] == "\n" { return index }
    return scan_comment_end(source, index + 1)
}

scan_ident_end(source, index) {
    if index >= len(source) { return index }
    if !is_ident_continue(source[index]) { return index }
    return scan_ident_end(source, index + 1)
}

scan_number(source, index, dot) {
    if index >= len(source) { return [index, dot] }
    current = source[index]
    if is_digit(current) { return scan_number(source, index + 1, dot) }
    if current == "." && !dot && index + 1 < len(source) && is_digit(source[index + 1]) {
        return scan_number(source, index + 1, true)
    }
    return [index, dot]
}

scan_string(source, index, value, escaped) {
    if index >= len(source) {
        assert(false, "unterminated string literal")
        return [value, index]
    }
    current = source[index]
    if escaped {
        return scan_string(source, index + 1, value + decode_escape(current), false)
    }
    if current == "\\" { return scan_string(source, index + 1, value, true) }
    if current == "\"" { return [value, index + 1] }
    return scan_string(source, index + 1, value + current, false)
}

lex(source) {
    var result = []
    var index = 0
    length = len(source)

    for step in range(length) {
        if step == index {
            ch = source[index]
            next = if index + 1 < length { source[index + 1] } else { "" }

            if ch == " " || ch == "\t" || ch == "\r" {
                index = index + 1
            } else if ch == "\n" {
                push(result, Token("sep", "\n"))
                index = index + 1
            } else if ch == "/" && next == "/" {
                index = scan_comment_end(source, index + 2)
            } else if is_digit(ch) {
                scan = scan_number(source, index + 1, false)
                end = scan[0]
                dot = scan[1]
                text = slice(source, index, end)
                kind = if dot { "float" } else { "int" }
                push(result, Token(kind, text))
                index = end
            } else if ch == "\"" {
                scan = scan_string(source, index + 1, "", false)
                value = scan[0]
                end = scan[1]
                push(result, Token("string", value))
                index = end
            } else if is_ident_start(ch) {
                end = scan_ident_end(source, index + 1)
                text = slice(source, index, end)
                keyword = keyword_kind(text)
                if keyword != null {
                    push(result, Token(keyword, text))
                } else if is_upper(ch) {
                    push(result, Token("data-ident", text))
                } else {
                    push(result, Token("ident", text))
                }
                index = end
            } else {
                pair = ch + next
                if pair == "==" || pair == "!=" || pair == "<=" || pair == ">=" || pair == "&&" || pair == "||" || pair == "?." || pair == "?:" || pair == "=>" || pair == "->" {
                    push(result, Token(pair, pair))
                    index = index + 2
                } else {
                    valid = ch == "=" || ch == "+" || ch == "-" || ch == "*" || ch == "/" || ch == "%" || ch == "<" || ch == ">" || ch == "!" || ch == "." || ch == "," || ch == ":" || ch == ";" || ch == "?" || ch == "(" || ch == ")" || ch == "{" || ch == "}" || ch == "[" || ch == "]"
                    assert(valid, "unexpected character in source")
                    if ch == ";" {
                        push(result, Token("sep", ch))
                    } else {
                        push(result, Token(ch, ch))
                    }
                    index = index + 1
                }
            }
        }
    }

    push(result, Token("eof", ""))
    return result
}

quote(value) {'''
          text, count = re.subn(pattern, lambda _: '\n' + replacement.lstrip('\n'), text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'expected one lex function, replaced {count}')
          path.write_text(text)
          PY
      - name: Static gates
        shell: bash
        run: |
          cargo fmt --all -- --check
          cargo check --all-targets
          cargo clippy --all-targets -- -D warnings
      - name: Full-source lexer
        shell: bash
        run: timeout 90s cargo test --test self_host compiled_compiler_lexes_its_source -- --exact --nocapture
      - name: Minimal compiler equivalence
        run: cargo test --test self_host compiled_compiler_matches_stage_zero_on_minimal_source -- --exact --nocapture
      - name: Commit verified lexer optimization
        shell: bash
        run: |
          cat > .github/workflows/ci.yml <<'EOF'
          name: CI

          on:
            push:
              branches: [main, rust-self-hosted-bootstrap]
            pull_request:

          permissions:
            contents: read

          jobs:
            rust:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: dtolnay/rust-toolchain@stable
                  with:
                    components: rustfmt, clippy
                - name: Format
                  run: cargo fmt --all -- --check
                - name: Check
                  run: cargo check --all-targets
                - name: Clippy
                  run: cargo clippy --all-targets -- -D warnings
                - name: Test
                  run: cargo test --all-targets
          EOF
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- compiler/main.vel .github/workflows/ci.yml
          git commit -m "perf: make self-host lexer scans linear"
          git push origin HEAD:self-hosted-compiler
