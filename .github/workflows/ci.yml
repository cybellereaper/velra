name: CI

on:
  push:
    branches: [main, rust-self-hosted-bootstrap]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format working tree
        run: cargo fmt --all
      - name: Check
        run: cargo check --all-targets
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --all-targets
      - name: Capture formatted sources
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rustfmt-output
          path: |
            src
            tests
