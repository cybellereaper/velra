name: Publish Velra v0.1.0

on:
  push:
    branches: [self-hosted-compiler]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: velra-x86_64-unknown-linux-gnu
            archive: velra-x86_64-unknown-linux-gnu.tar.gz
          - os: windows-latest
            artifact: velra-x86_64-pc-windows-msvc
            archive: velra-x86_64-pc-windows-msvc.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release binary
        run: cargo build --release
      - name: Smoke test embedded compiler
        shell: bash
        run: |
          printf 'answer = 40 + 2\nprintln(answer)\n' > release-smoke.vel
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            ./target/release/velra.exe check release-smoke.vel
            ./target/release/velra.exe compile release-smoke.vel release-smoke.velc
            ./target/release/velra.exe exec release-smoke.velc
          else
            ./target/release/velra check release-smoke.vel
            ./target/release/velra compile release-smoke.vel release-smoke.velc
            ./target/release/velra exec release-smoke.velc
          fi
      - name: Package Linux binary
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/velra dist/velra
          cp README.md LICENSE dist/
          tar -C dist -czf "${{ matrix.archive }}" velra README.md LICENSE
          sha256sum "${{ matrix.archive }}" > "${{ matrix.archive }}.sha256"
      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/velra.exe dist/velra.exe
          Copy-Item README.md dist/README.md
          Copy-Item LICENSE dist/LICENSE
          Compress-Archive -Path dist/* -DestinationPath "${{ matrix.archive }}"
          $hash = (Get-FileHash "${{ matrix.archive }}" -Algorithm SHA256).Hash.ToLower()
          "$hash  ${{ matrix.archive }}" | Set-Content -NoNewline "${{ matrix.archive }}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.archive }}
            ${{ matrix.archive }}.sha256
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/download-artifact@v4
        with:
          pattern: velra-*
          merge-multiple: true
      - name: Publish v0.1.0
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG=v0.1.0
          TARGET_SHA=$(git rev-parse HEAD^)
          ASSETS=(
            velra-x86_64-unknown-linux-gnu.tar.gz
            velra-x86_64-unknown-linux-gnu.tar.gz.sha256
            velra-x86_64-pc-windows-msvc.zip
            velra-x86_64-pc-windows-msvc.zip.sha256
          )

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$TARGET_SHA" \
              --title "Velra v0.1.0" \
              --generate-notes \
              "${ASSETS[@]}"
          fi

      - name: Remove one-shot publisher
        shell: bash
        run: |
          rm .github/workflows/publish-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- .github/workflows/publish-once.yml
          git commit -m "chore: remove one-shot release publisher"
          git push origin HEAD:self-hosted-compiler
