name: Release

on:
  pull_request:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: velra-x86_64-unknown-linux-gnu
            archive: velra-x86_64-unknown-linux-gnu.tar.gz
          - os: windows-latest
            artifact: velra-x86_64-pc-windows-msvc
            archive: velra-x86_64-pc-windows-msvc.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release binary
        run: cargo build --release
      - name: Smoke test embedded compiler
        shell: bash
        run: |
          printf 'answer = 40 + 2\nprintln(answer)\n' > release-smoke.vel
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            ./target/release/velra.exe check release-smoke.vel
            ./target/release/velra.exe compile release-smoke.vel release-smoke.velc
            ./target/release/velra.exe exec release-smoke.velc
          else
            ./target/release/velra check release-smoke.vel
            ./target/release/velra compile release-smoke.vel release-smoke.velc
            ./target/release/velra exec release-smoke.velc
          fi
      - name: Package Linux binary
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/velra dist/velra
          cp README.md LICENSE dist/
          tar -C dist -czf "${{ matrix.archive }}" velra README.md LICENSE
          sha256sum "${{ matrix.archive }}" > "${{ matrix.archive }}.sha256"
      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/velra.exe dist/velra.exe
          Copy-Item README.md dist/README.md
          Copy-Item LICENSE dist/LICENSE
          Compress-Archive -Path dist/* -DestinationPath "${{ matrix.archive }}"
          $hash = (Get-FileHash "${{ matrix.archive }}" -Algorithm SHA256).Hash.ToLower()
          "$hash  ${{ matrix.archive }}" | Set-Content -NoNewline "${{ matrix.archive }}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.archive }}
            ${{ matrix.archive }}.sha256
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: velra-*
          merge-multiple: true
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            velra-*.tar.gz velra-*.tar.gz.sha256 velra-*.zip velra-*.zip.sha256
