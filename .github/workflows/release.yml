name: Release

on:
  pull_request:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: velra-x86_64-unknown-linux-gnu
            archive: velra-x86_64-unknown-linux-gnu.tar.gz

          - os: windows-latest
            artifact: velra-x86_64-pc-windows-msvc
            archive: velra-x86_64-pc-windows-msvc.zip

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release

      - name: Smoke test embedded compiler (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          printf 'answer = 40 + 2\nprintln(answer)\n' > release-smoke.vel
          ./target/release/velra check release-smoke.vel
          ./target/release/velra compile release-smoke.vel release-smoke.velc
          ./target/release/velra exec release-smoke.velc

      - name: Smoke test embedded compiler (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "answer = 40 + 2`nprintln(answer)" | Out-File release-smoke.vel -Encoding utf8
          .\target\release\velra.exe check release-smoke.vel
          .\target\release\velra.exe compile release-smoke.vel release-smoke.velc
          .\target\release\velra.exe exec release-smoke.velc

      - name: Package Linux binary
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir dist
          cp target/release/velra dist/
          cp README.md LICENSE dist/

          tar -C dist -czf "${{ matrix.archive }}" \
            velra README.md LICENSE

          sha256sum "${{ matrix.archive }}" \
            > "${{ matrix.archive }}.sha256"

      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null

          Copy-Item target/release/velra.exe dist/
          Copy-Item README.md dist/
          Copy-Item LICENSE dist/

          Compress-Archive `
            -Path dist/* `
            -DestinationPath "${{ matrix.archive }}" `
            -Force

          $hash = (Get-FileHash "${{ matrix.archive }}" -Algorithm SHA256).Hash.ToLower()
          "$hash  ${{ matrix.archive }}" |
            Set-Content "${{ matrix.archive }}.sha256"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.archive }}
            ${{ matrix.archive }}.sha256
          if-no-files-found: error


  publish:
    name: Publish Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: velra-*
          merge-multiple: true

      - name: Verify release files
        run: |
          ls -lah
          test -n "$(find . -name 'velra-*')"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --generate-notes \
            --clobber \
            velra-*
